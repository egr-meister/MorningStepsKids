name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      enable_r8:
        description: "Build with R8 + resource shrinking (only after a non-minified release was verified)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (uses the committed wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36 and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" "platform-tools" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/${BUILD_TOOLS}" >> "$GITHUB_ENV"

      - name: Unit tests and release lint
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore

      - name: Decode release keystore (PKCS12)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Release artifacts are never signed with a debug key."
            exit 1
          fi
          KS="$RUNNER_TEMP/release-keystore.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          R8_FLAG="-PenableR8=${{ github.event.inputs.enable_r8 == 'true' && 'true' || 'false' }}"
          ./gradlew --no-daemon "$R8_FLAG" assembleRelease bundleRelease

      - name: Verify APK signature (apksigner)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-certs.txt
          if grep -q "CN=Android Debug" apk-certs.txt; then
            echo "::error::APK is signed with the Android debug certificate"; exit 1
          fi
          # The APK signer must be the release key from the keystore.
          EXPECTED=$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" apk-certs.txt | sed 's/.*digest: //')
          echo "expected=$EXPECTED actual=$ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signer does not match the release keystore certificate"; exit 1
          fi

      - name: Verify AAB signature (jarsigner)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          # A self-signed upload certificate is expected; jarsigner may warn about the chain.
          # What matters: the signature verifies and the signer is our release certificate.
          jarsigner -verify -verbose -certs "$AAB" > aab-verify.txt 2>&1 || true
          tail -n 20 aab-verify.txt
          if ! grep -q "jar verified" aab-verify.txt; then
            echo "::error::AAB signature did not verify"; exit 1
          fi
          if grep -qi "unsigned entries\|jar is unsigned" aab-verify.txt; then
            echo "::error::AAB contains unsigned entries"; exit 1
          fi
          keytool -printcert -jarfile "$AAB" | tee aab-certs.txt
          if grep -q "CN=Android Debug" aab-certs.txt; then
            echo "::error::AAB is signed with the Android debug certificate"; exit 1
          fi
          EXPECTED=$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          ACTUAL=$(grep -m1 "SHA256:" aab-certs.txt | sed 's/.*SHA256: //')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::AAB signer does not match the release keystore certificate"; exit 1
          fi

      - name: Check release permissions
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -E "uses-permission" permissions.txt; then
            echo "::error::Release APK declares permissions; none are expected"; exit 1
          fi
          MERGED=$(find app/build/intermediates -path "*release*" -name AndroidManifest.xml | grep -i merged | head -n 1)
          echo "Merged manifest: $MERGED"
          if [ -n "$MERGED" ] && grep -q "<uses-permission" "$MERGED"; then
            grep "<uses-permission" "$MERGED"
            echo "::error::Merged release manifest declares permissions"; exit 1
          fi
          echo "No permissions declared." >> permissions.txt

      - name: Inspect native libraries (16 KB page size)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          {
            echo "APK native libraries:"; unzip -l "$APK" | grep -E '\.so$' || echo "  none"
            echo "AAB native libraries:"; unzip -l "$AAB" | grep -E '\.so$' || echo "  none"
          } | tee native-libs.txt
          if unzip -l "$APK" | grep -qE '\.so$'; then
            "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -n 5
            mkdir -p so && unzip -o -q "$APK" 'lib/*' -d so
            fail=0
            for so in $(find so -name '*.so'); do
              for a in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
                if [ $((a)) -lt 16384 ]; then echo "::error::$so LOAD alignment $a < 16 KB"; fail=1; fi
              done
            done
            exit $fail
          else
            echo "No native libraries are packaged; 16 KB ELF alignment does not apply." | tee -a native-libs.txt
          fi

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morningsteps-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            apk-certs.txt
            aab-certs.txt
            permissions.txt
            native-libs.txt
          if-no-files-found: error

      - name: Upload R8 mapping
        if: github.event.inputs.enable_r8 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"
